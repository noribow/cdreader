name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test CLI
        run: |
          build\Release\cdreader.exe --version
          build\Release\cdreader.exe --help
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: cdreader-windows-x64
          path: build/Release/cdreader.exe

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reference tools for the external decoder tests (flac_roundtrip, flac_cuesheet, lossy_decode,
      # alac_ffmpeg). libopus / libogg / libvorbis themselves are fetched by CMake (cmake/Codecs.cmake).
      - name: Install reference decoders (flac, opus-tools, vorbis-tools, ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y flac opus-tools vorbis-tools ffmpeg
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # The fallback for offline builds: WAV / FLAC only, nothing fetched.
      - name: Build and test without the lossy codecs
        run: |
          cmake -S . -B build-nocodecs -DCDREADER_WITH_OPUS=OFF -DCDREADER_WITH_VORBIS=OFF
          cmake --build build-nocodecs -j
          ctest --test-dir build-nocodecs --output-on-failure

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        working-directory: android
        run: |
          # Use the NDK preinstalled on the runner instead of downloading AGP's default one.
          ndk_args=()
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            ndk_args+=("-Pcdreader.ndkVersion=$(basename "$ANDROID_NDK_LATEST_HOME")")
          fi
          gradle assembleDebug --no-daemon --stacktrace "${ndk_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: cdreader-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
